[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrchestra-mcp"
version = "0.2.0"
description = "Agent-ready control of Seerr, Sonarr, Radarr, NZBGet, SABnzbd and NZBHydra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.30,<2.0",
  "httpx>=0.27,<1.0",
  "anyio>=4.5,<5.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
arrchestra-mcp = "jellyseerr_mcp.server:main"

[tool.setuptools.packages.find]
include = ["jellyseerr_mcp*", "arrchestra_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
